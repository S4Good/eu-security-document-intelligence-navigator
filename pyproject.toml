[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-security-document-intelligence-navigator"
version = "0.1.0"
description = "Azure-based document intelligence and cited search for official EU and German sources."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.20,<1.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.24,<1.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.1,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]